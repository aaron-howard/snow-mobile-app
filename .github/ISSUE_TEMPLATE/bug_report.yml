name: Bug report
description: Report something that does not work as documented or expected (not for security issues).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security:** If this might be a vulnerability (auth bypass, data leak, RCE, etc.), **do not** file here — use the repository **Security** tab or follow [SECURITY.md](https://github.com/OWNER/REPO/blob/main/SECURITY.md) (replace `OWNER/REPO` with this repository).

        This app is **unofficial** and not affiliated with ServiceNow, Inc.

  - type: dropdown
    id: area
    attributes:
      label: Where does the bug show up?
      options:
        - Mobile app (Expo / React Native)
        - Cloudflare Worker / API
        - Sync (WatermelonDB ↔ worker)
        - Auth (Clerk)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the problem.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps. Include exam/screen if relevant (e.g. Catalog, Quiz for CSA).
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Device/OS, app build, and relevant config (no secrets).
      placeholder: |
        - Platform: iOS 18 / Android 15 / …
        - Dev client build (not Expo Go): yes/no
        - `EXPO_PUBLIC_API_BASE_URL` shape if relevant: local / deployed (no tokens)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots (optional)
      description: Paste redacted logs or attach screenshots. Never paste API keys, JWTs, or passwords.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
